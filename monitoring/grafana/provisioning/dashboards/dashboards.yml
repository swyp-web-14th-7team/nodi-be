# /etc/grafana/dashboards 의 샘플 JSON 을 기동 시 자동 등록.
# 등록된 대시보드는 Grafana UI 에서 수정·저장해 운영한다.
apiVersion: 1

providers:
  - name: nodi-be
    type: file
    # 프로비저닝된 샘플도 UI 에서 수정·저장할 수 있게 허용.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
