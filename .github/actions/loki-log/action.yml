name: Push log to Loki
description: 배포 파이프라인의 진행상황을 Loki 로 즉시 전송

# loki-tunnel 액션이 같은 job 안에서 먼저 실행돼 있어야 한다.
# 터널 덕분에 여기서는 localhost 로 POST 하면 끝이라 스텝당 오버헤드가 ~50ms 다.
#
# message 가 여러 줄이면 줄마다 별도 로그 엔트리가 된다. deploy.sh 출력 같은 것을
# 통째로 넘기면 Grafana 에서 원래 모양대로 한 줄씩 읽힌다.
#
# 터널이 없거나 Loki 가 죽어 있어도 이 액션은 실패하지 않는다. 로그 마커 때문에
# 배포가 멈추는 일은 없어야 하므로 전송 실패는 warning 으로만 남긴다.

inputs:
  message:
    description: 로그 본문. 여러 줄이면 줄 단위로 나뉘어 전송된다
    required: true
  level:
    description: info | warn | error — Loki 라벨로 승격되므로 이 3개만 사용할 것
    default: info
  version:
    description: 배포 버전 (package.json version). 비우면 로그에서 생략됨
    default: ''
  status:
    description: 이 시점의 상태 (started | success | failure 등). 비우면 생략
    default: ''
  source:
    description: 로그 출처 (예 deploy.sh). 본문에만 기록되며 라벨로는 쓰지 않는다
    default: ''
  port:
    description: loki-tunnel 이 연 러너 쪽 포트
    default: '3100'

outputs:
  line-count:
    description: 실제로 전송한 로그 라인 수
    value: ${{ steps.push.outputs.line-count }}

runs:
  using: composite
  steps:
    - name: Push log lines
      id: push
      shell: bash
      env:
        MSG: ${{ inputs.message }}
        LEVEL: ${{ inputs.level }}
        VERSION: ${{ inputs.version }}
        STATUS: ${{ inputs.status }}
        SOURCE: ${{ inputs.source }}
        PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail

        # 라벨 조합은 workflow × job × level 로 제한 (전부 저카디널리티).
        # run_id·sha·version 처럼 값이 매번 바뀌는 것은 본문에만 둔다.
        PAYLOAD=$(printf '%s' "$MSG" | jq -Rn \
          --arg sec     "$(date +%s)" \
          --arg level   "$LEVEL" \
          --arg status  "$STATUS" \
          --arg version "$VERSION" \
          --arg source  "$SOURCE" \
          --arg job     "$GITHUB_JOB" \
          --arg workflow "$GITHUB_WORKFLOW" \
          --arg sha     "$GITHUB_SHA" \
          --arg actor   "$GITHUB_ACTOR" \
          --arg event   "$GITHUB_EVENT_NAME" \
          --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          '
          # 인덱스를 나노초 자리에 넣어 같은 초에 보낸 줄들의 타임스탬프를 유일·오름차순으로 만든다.
          # (초 × 10^9 을 숫자로 계산하면 jq 의 double 정밀도(2^53)를 넘어 뭉개지므로 문자열로 이어붙인다)
          def pad9: tostring | ("00000000" + .) | .[-9:];

          [inputs]
          # deploy.sh 는 색을 입혀 출력하므로 ANSI 이스케이프를 걷어낸다.
          | map(gsub("\u001b\\[[0-9;]*m"; "") | sub("\r$"; ""))
          | map(select(test("^\\s*$") | not))          # 빈 줄은 노이즈라 버림
          | to_entries
          | {
              streams: [{
                stream: {
                  service: "github-actions",
                  workflow: $workflow,
                  job: $job,
                  level: $level,
                },
                values: map([
                  ($sec + (.key | pad9)),
                  # 본문은 JSON — backend(pino) 로그와 같은 모양이라 `| json` 으로 판다.
                  ({ level: $level, msg: .value, status: $status, version: $version,
                     source: $source, job: $job, sha: $sha, actor: $actor,
                     event: $event, run_url: $run_url }
                   | with_entries(select(.value != "")) | tojson)
                ]),
              }]
            }
          ')

        COUNT=$(jq '[.streams[].values[]] | length' <<<"$PAYLOAD")
        echo "line-count=$COUNT" >> "$GITHUB_OUTPUT"

        # 보낼 줄이 없으면(빈 메시지) Loki 는 빈 스트림을 거부하므로 그냥 끝낸다.
        if [ "$COUNT" -eq 0 ]; then
          echo "보낼 로그 라인이 없어 건너뜁니다"
          exit 0
        fi

        printf '%s' "$PAYLOAD" \
          | curl -sS --fail-with-body -m 15 \
              -X POST "http://localhost:${PORT}/loki/api/v1/push" \
              -H 'Content-Type: application/json' \
              --data-binary @- \
          || echo "::warning::Loki 전송 실패 (터널 미개통 또는 Loki 다운) — 배포에는 영향 없음"

        echo "Loki 로 $COUNT 줄 전송"
