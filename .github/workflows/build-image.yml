name: Build and Push Image (arm64)

# main 에 push(=PR 머지) 될 때마다 arm64 이미지를 빌드해 GHCR 에 푸시
on:
  push:
    branches: [main]
  workflow_dispatch: # 필요 시 수동 실행

# 배포 도중 새 push 로 workflow 가 취소되면 blue-green 전환이 중간에 끊길 수 있다.
# 같은 브랜치의 실행은 취소하지 않고 순서대로 대기시킨다.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # 예: swyp-web-14th-7team/nodi-be

jobs:
  # ── 1) 버전 태그 중복 검사 ─────────────────────────────
  # package.json 의 version 이 이미 GHCR 에 있으면 실패 → build 잡이 안 돎(취소)
  # 레지스트리 조회만 하므로 저렴한 x86 러너 사용
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # 태그 존재 확인용
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 이후 스텝들이 localhost:3100 으로 바로 Loki 에 쓸 수 있게 터널을 연다.
      # job 마다 러너가 다르므로 job 마다 한 번씩 필요하다.
      - name: Open Loki tunnel
        uses: ./.github/actions/loki-tunnel
        continue-on-error: true
        with:
          ssh-host: ${{ secrets.PROD_SSH_HOST }}
          ssh-port: ${{ secrets.PROD_SSH_PORT }}
          ssh-user: ${{ secrets.PROD_SSH_USER }}
          ssh-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          ssh-fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Report pipeline start
        continue-on-error: true
        uses: ./.github/actions/loki-log
        with:
          message: 파이프라인 시작 — 버전 검사
          status: started
          version: ${{ steps.pkg.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if version tag already exists
        run: |
          IMAGE=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ env.REGISTRY }}/$IMAGE:v${{ steps.pkg.outputs.version }}"
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG 이미 존재 — package.json version 을 올리세요."
            exit 1
          fi
          echo "$TAG 없음 → 빌드 진행"

      - name: Report version check failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/loki-log
        with:
          message: 버전 검사 실패 — 파이프라인 중단
          level: error
          status: failure
          version: ${{ steps.pkg.outputs.version }}

  # ── 2) 이미지 빌드 & 푸시 ──────────────────────────────
  # check-version 성공 시에만 실행 (중복 버전이면 여기 도달 못 함)
  build-and-push:
    needs: check-version
    # arm64 네이티브 러너 → QEMU 에뮬레이션 없이 빠르게 arm64 빌드
    # (private repo 에서 arm 러너를 못 쓰는 플랜이면 runs-on: ubuntu-latest 로 바꾸고
    #  아래 'Set up QEMU' 스텝 주석을 해제할 것)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # GHCR 푸시 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open Loki tunnel
        uses: ./.github/actions/loki-tunnel
        continue-on-error: true
        with:
          ssh-host: ${{ secrets.PROD_SSH_HOST }}
          ssh-port: ${{ secrets.PROD_SSH_PORT }}
          ssh-user: ${{ secrets.PROD_SSH_USER }}
          ssh-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          ssh-fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}

      - name: Report build start
        continue-on-error: true
        uses: ./.github/actions/loki-log
        with:
          message: arm64 이미지 빌드 시작
          status: started
          version: ${{ needs.check-version.outputs.version }}

      # QEMU (에뮬레이션으로 arm64 빌드할 때만 필요 — 네이티브 arm 러너면 불필요)
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 별도 시크릿 불필요

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest + 커밋 SHA + package.json 버전 태그 부여
          # (SHA 는 불변 핀용, latest 는 최신, 버전은 사람이 읽는 릴리스 식별)
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value=v${{ needs.check-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # package.json 버전을 이미지에 주입 → node 직접 실행 시에도 Swagger 버전 표시
          build-args: |
            APP_VERSION=${{ needs.check-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 캐시로 레이어 재사용 → 빌드 속도 향상
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report build result
        if: always()
        continue-on-error: true
        uses: ./.github/actions/loki-log
        with:
          message: >-
            ${{ job.status == 'success'
                && '이미지 빌드·푸시 완료 → 배포 시작 대기'
                || '이미지 빌드 실패' }}
          level: ${{ job.status == 'success' && 'info' || 'error' }}
          status: ${{ job.status }}
          version: ${{ needs.check-version.outputs.version }}

  # ── 3) 운영 서버 배포 ──────────────────────────────────
  # 이미지 push 가 끝난 뒤 SSH 로 운영 서버에 접속해 이미지를 받고 배포 스크립트를 실행한다.
  deploy:
    needs: [check-version, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      # build job 과 runner 가 다르므로 SCP 로 보낼 파일을 다시 checkout 한다.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open Loki tunnel
        uses: ./.github/actions/loki-tunnel
        continue-on-error: true
        with:
          ssh-host: ${{ secrets.PROD_SSH_HOST }}
          ssh-port: ${{ secrets.PROD_SSH_PORT }}
          ssh-user: ${{ secrets.PROD_SSH_USER }}
          ssh-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          ssh-fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}

      - name: Report deploy start
        continue-on-error: true
        uses: ./.github/actions/loki-log
        with:
          message: 운영 서버 배포 시작
          status: started
          version: ${{ needs.check-version.outputs.version }}

      # 운영 환경변수는 저장소에 두지 않고 production Environment Secret으로 파일을 만든다.
      - name: Create deployment environment file
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -z "$PROD_ENV_FILE" ]; then
            echo "::error::production Environment Secret PROD_ENV_FILE 이 비어 있습니다."
            exit 1
          fi
          umask 077
          printf '%s\n' "$PROD_ENV_FILE" > .env.deploy

      # Compose·실행 스크립트·정적 nginx/monitoring 설정을 현재 커밋 버전으로 덮어쓴다.
      # nginx/active/upstream.conf 는 현재 활성 색 상태이므로 SCP 대상에 넣지 않는다.
      - name: Copy deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          port: ${{ secrets.PROD_SSH_PORT }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}
          source: docker-compose.yml,.env.deploy,scripts/deploy.sh,nginx/conf.d/default.conf,monitoring
          target: ${{ vars.PROD_DEPLOY_PATH }}
          overwrite: true

      - name: Report files copied
        continue-on-error: true
        uses: ./.github/actions/loki-log
        with:
          message: 배포 파일 전송 완료 → blue-green 전환 시작
          status: running
          version: ${{ needs.check-version.outputs.version }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          port: ${{ secrets.PROD_SSH_PORT }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,GHCR_IMAGE
          script: |
            set -euo pipefail
            # 실패 시 아래 'Collect deploy.sh log' 가 이 파일을 긁어간다.
            # 이번 실행이 deploy.sh 까지 못 갔을 때 지난 배포 로그를 잘못 보내지 않도록 먼저 비운다.
            : > /tmp/nodi-deploy-last.log
            chmod 600 "${DEPLOY_PATH}/.env.deploy"
            mkdir -p "${DEPLOY_PATH}/nginx/active"
            if [ ! -f "${DEPLOY_PATH}/nginx/active/upstream.conf" ]; then
              printf '%s\n' 'set $upstream backend_blue:3000;' > "${DEPLOY_PATH}/nginx/active/upstream.conf"
            fi
            docker pull "${GHCR_IMAGE}:latest"
            # err() 는 stderr 로 나가므로 2>&1 로 합쳐야 실패 원인이 로그에 남는다.
            # set -o pipefail 이 걸려 있어 tee 를 거쳐도 deploy.sh 의 종료 코드가 유지된다.
            "${DEPLOY_PATH}/scripts/deploy.sh" 2>&1 | tee /tmp/nodi-deploy-last.log
            docker image prune -f

      # deploy.sh 출력은 서버에만 남으므로 실패했을 때만 다시 접속해 가져온다.
      # 실패한 스텝의 outputs 는 세팅이 보장되지 않아, 이렇게 '성공하는 별도 스텝'으로 분리했다.
      - name: Collect deploy.sh log
        if: failure()
        id: deploy-log
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          port: ${{ secrets.PROD_SSH_PORT }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}
          capture_stdout: true
          script: tail -n 300 /tmp/nodi-deploy-last.log 2>/dev/null || true

      # deploy.sh 출력을 줄 단위로 Loki 에 넣는다 (loki-log 가 개행으로 쪼갬).
      - name: Report deploy.sh log
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/loki-log
        with:
          message: ${{ steps.deploy-log.outputs.stdout }}
          level: error
          status: failure
          source: deploy.sh
          version: ${{ needs.check-version.outputs.version }}

      # Grafana 에서 "이 에러가 몇 시 배포 이후부터인지" 보는 기준선이 되는 마커.
      - name: Report deploy result
        if: always()
        continue-on-error: true
        uses: ./.github/actions/loki-log
        with:
          message: >-
            ${{ job.status == 'success'
                && '🎉 배포 완료 — 신규 버전이 트래픽을 받기 시작'
                || '배포 실패 — deploy.sh 로그 확인 필요' }}
          level: ${{ job.status == 'success' && 'info' || 'error' }}
          status: ${{ job.status }}
          version: ${{ needs.check-version.outputs.version }}
