name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma Client 생성에는 URL 형식이 필요하지만 DB 연결은 하지 않는다.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check formatting
        run: npm run format:check

      - name: Check lint
        run: npm run lint:check

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build
