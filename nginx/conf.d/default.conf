# 앞단(호스트 nginx 등)이 보낸 X-Forwarded-Proto 가 있으면 그대로 신뢰하고,
# 없으면(도커 nginx 직접 접근) 현재 scheme 으로 fallback → 외부 nginx 유무 둘 다 정상
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 기본 combined 포맷은 평문이라 Loki 에서 필드로 못 거르고, 무엇보다 $request_id 가 안 남아
# 백엔드 로그와 같은 요청으로 묶이지 않는다 (502 처럼 백엔드에 줄이 아예 없는 경우가 특히 문제).
# escape=json 은 값에 따옴표가 섞여도 JSON 이 깨지지 않게 한다.
#
# $upstream_addr 은 resolver 가 푼 IP 라 사람이 못 읽으므로,
# location 에서 set 한 $upstream(= backend_blue:3000)을 target 으로 같이 남겨 색을 식별한다.
log_format json_log escape=json '{'
    '"req_id":"$request_id",'
    '"method":"$request_method",'
    '"url":"$request_uri",'
    '"status":"$status",'
    '"target":"$upstream",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"request_time":"$request_time",'
    '"upstream_time":"$upstream_response_time",'
    '"body_bytes":"$body_bytes_sent",'
    '"ip":"$remote_addr",'
    '"ua":"$http_user_agent"'
'}';

server {
    listen 80;
    server_name _;

    # 이미지가 /var/log/nginx/access.log 를 /dev/stdout 으로 심볼릭 링크해 둬서
    # 이 경로로 쓰면 그대로 컨테이너 stdout → Alloy 로 흘러간다.
    access_log /var/log/nginx/access.log json_log;

    # Docker 내부 DNS 10초마다 갱신
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 6m;

    location / {
        # 활성 색(blue/green)을 가리키는 파일에서 $upstream 을 가져옴
        # 배포 스크립트가 이 파일만 교체하고 nginx reload → 무중단 전환
        include /etc/nginx/active/upstream.conf;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;

        # 연결 실패/타임아웃 시 다음 IP 로 재시도
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 5;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # nginx 가 생성하는 요청 ID 를 백엔드로 전달 (genReqId 가 이 헤더를 우선 사용)
        proxy_set_header X-Request-Id      $request_id;
    }
}
